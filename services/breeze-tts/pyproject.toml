# Pins are copied verbatim from vendor/breeze-tts-mlx/pyproject.toml (commit 4e045c13).
# They must stay in lockstep: the vendored port is imported via sys.path, not installed,
# so uv resolves one environment for both. Bump them together or resolution fights.
[project]
name = "breeze-tts-service"
version = "0.1.0"
description = "Local narration service: Breeze TTS 2 on Apple Silicon behind a job API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx==0.32.2",
  "numpy>=2.0,<3",
  "qwen-tts==0.1.1",
  "safetensors>=0.8,<1",
  "soundfile>=0.13,<1",
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "transformers==4.57.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "huggingface-hub>=0.26",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
